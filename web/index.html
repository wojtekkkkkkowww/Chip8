<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CHIP-8 Arcade</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>CHIP-8 <span>Arcade</span></h1>
        <p id="page-intro">Choose a game to begin.</p>
      </header>

      <section id="game-menu" aria-label="Choose a game">
        <div id="game-list" class="game-grid"></div>
      </section>

      <section id="game-view" class="game-view" hidden>
        <div class="game-toolbar">
          <button id="back" class="secondary">← All games</button>
          <div class="game-heading">
            <h2 id="game-title"></h2>
            <p id="game-description"></p>
          </div>
        </div>

        <div class="arcade-cabinet">
          <canvas id="screen" width="64" height="32" aria-label="CHIP-8 game screen"></canvas>
          <div class="controls">
            <button id="pause" disabled>Pause</button>
            <button id="reset" class="secondary" disabled>Restart</button>
          </div>
        </div>

        <section class="instructions" aria-labelledby="controls-title">
          <h3 id="controls-title">How to play</h3>
          <p id="game-controls"></p>
          <p class="keypad">CHIP-8 keypad: <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> /
            <kbd>Q</kbd> <kbd>W</kbd> <kbd>E</kbd> <kbd>R</kbd> /
            <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> /
            <kbd>Z</kbd> <kbd>X</kbd> <kbd>C</kbd> <kbd>V</kbd></p>
        </section>
      </section>

      <p id="status" role="status">Loading emulator…</p>
      <footer><a href="https://github.com/JohnEarnest/chip8Archive">Games and preview art from the CC0 CHIP-8 Archive</a></footer>
    </main>
  </body>
</html>
